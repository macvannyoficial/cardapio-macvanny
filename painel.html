<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Cantor — Cardápio Musical</title>
  <link rel="manifest" href="./manifest-painel.json?v=6">
  <link rel="apple-touch-icon" href="./icone.jpg?v=6">
  <meta name="theme-color" content="#121212">
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b36;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f59e0b;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.75rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #1c2029;
    }

    .menu-btn.primary {
      border-color: rgba(245, 158, 11, 0.45);
    }

    .menu-icon {
      font-size: 1.5rem;
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .menu-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Modal de Estatísticas */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.25rem;
      color: var(--accent);
    }

    .close-btn {
      background: #232834;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .close-btn:hover {
      border-color: var(--accent);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .kpi-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }

    .kpi-value.accent {
      color: var(--accent);
    }

    .kpi-value.success {
      color: var(--success);
    }

    .stats-section {
      margin-bottom: 18px;
    }

    .stats-section h3 {
      font-size: 0.98rem;
      color: var(--text);
      margin-bottom: 10px;
    }

    .rank-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
    }

    .rank-badge {
      background: rgba(245, 158, 11, 0.16);
      color: var(--accent);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.9rem;
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Painel do Cantor</h1>
      <p>Cardápio Musical — Escolha o que deseja gerenciar</p>
    </header>

    <section class="menu-grid" aria-label="Opções do painel">
      <a class="menu-btn primary" href="./pedidos.html">
        <span class="menu-icon">🎶</span>
        <span class="menu-title">VER PEDIDOS</span>
        <span class="menu-desc">Acompanhar pedidos em tempo real e atualizar status</span>
      </a>

      <a class="menu-btn" href="./repertorio.html">
        <span class="menu-icon">🎼</span>
        <span class="menu-title">REPERTÓRIO</span>
        <span class="menu-desc">Incluir músicas, editar nome, artista, estilo e visibilidade</span>
      </a>

      <button type="button" class="menu-btn" id="btnEstatisticas">
        <span class="menu-icon">📊</span>
        <span class="menu-title">ESTATÍSTICAS</span>
        <span class="menu-desc">Mais pedidas, estilos em alta, horários de pico e Pix</span>
      </button>
    </section>
  </main>

  <div class="modal-backdrop" id="modalEstatisticas" role="dialog" aria-modal="true" aria-labelledby="tituloStats">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="tituloStats">📊 Estatísticas dos Pedidos</h2>
        <button type="button" class="close-btn" id="fecharStats">Fechar</button>
      </div>
      <div id="conteudoStats"></div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw-painel.js").catch(() => {});
      });
    }

    const modal = document.getElementById("modalEstatisticas");
    const btnAbrir = document.getElementById("btnEstatisticas");
    const btnFechar = document.getElementById("fecharStats");
    const conteudoStats = document.getElementById("conteudoStats");

    function buscarPedidosLocais() {
      const chavesPossiveis = ["pedidos", "pedidos_cardapio", "cardapio_pedidos", "orders"];
      for (const chave of chavesPossiveis) {
        try {
          const bruto = localStorage.getItem(chave);
          if (!bruto) continue;
          const parsed = JSON.parse(bruto);
          if (Array.isArray(parsed)) return parsed;
          if (parsed && Array.isArray(parsed.pedidos)) return parsed.pedidos;
        } catch (_) {}
      }
      return [];
    }

    function calcularEstatisticas(pedidos) {
      const total = pedidos.length;
      const tocadas = pedidos.filter(p => (p.status || "").toLowerCase() === "tocada").length;
      const pendentes = total - tocadas;
      const taxaAtendimento = total > 0 ? Math.round((tocadas / total) * 100) : 0;

      const comPix = pedidos.filter(p => Boolean(p.pix || p.valorPix || p.gorjeta || p.contribuiuPix)).length;
      const pctPix = total > 0 ? Math.round((comPix / total) * 100) : 0;

      const contagemMusicas = {};
      const contagemEstilos = {};
      const contagemHorarios = {};

      pedidos.forEach(p => {
        const musica = (p.musica || p.titulo || p.nome || "Sem título").trim();
        const artista = (p.artista || "").trim();
        const rotuloMusica = artista ? `${musica} — ${artista}` : musica;
        contagemMusicas[rotuloMusica] = (contagemMusicas[rotuloMusica] || 0) + 1;

        const estilo = (p.estilo || p.ritmo || p.genero || "Não informado").trim();
        contagemEstilos[estilo] = (contagemEstilos[estilo] || 0) + 1;

        const dataRef = p.criadoEm || p.timestamp || p.data || p.hora;
        if (dataRef) {
          const d = new Date(dataRef);
          if (!Number.isNaN(d.getTime())) {
            const faixaHora = `${String(d.getHours()).padStart(2, "0")}h`;
            contagemHorarios[faixaHora] = (contagemHorarios[faixaHora] || 0) + 1;
          }
        }
      });

      const ordenarTop = obj =>
        Object.entries(obj)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);

      return {
        total,
        tocadas,
        pendentes,
        taxaAtendimento,
        comPix,
        pctPix,
        topMusicas: ordenarTop(contagemMusicas),
        topEstilos: ordenarTop(contagemEstilos),
        topHorarios: ordenarTop(contagemHorarios)
      };
    }

    function renderizarRanking(titulo, itens, sufixo = "pedido(s)") {
      if (!itens.length) {
        return `
          <div class="stats-section">
            <h3>${titulo}</h3>
            <div class="empty-msg">Sem dados suficientes ainda.</div>
          </div>
        `;
      }
      return `
        <div class="stats-section">
          <h3>${titulo}</h3>
          <ul class="rank-list">
            ${itens.map(([nome, qtd], idx) => `
              <li class="rank-item">
                <span><strong>#${idx + 1}</strong> ${nome}</span>
                <span class="rank-badge">${qtd} ${sufixo}</span>
              </li>
            `).join("")}
          </ul>
        </div>
      `;
    }

    function abrirEstatisticas() {
      const pedidos = buscarPedidosLocais();
      if (!pedidos.length) {
        conteudoStats.innerHTML = `
          <div class="empty-msg">
            Nenhum pedido encontrado no armazenamento local deste navegador ainda.<br>
            Assim que os pedidos chegarem em <strong>VER PEDIDOS</strong>, os indicadores aparecerão aqui automaticamente.
          </div>
        `;
        modal.classList.add("open");
        return;
      }

      const stats = calcularEstatisticas(pedidos);
      conteudoStats.innerHTML = `
        <div class="kpis">
          <div class="kpi-card">
            <div class="kpi-label">Total de Pedidos</div>
            <div class="kpi-value accent">${stats.total}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Tocadas / Pendentes</div>
            <div class="kpi-value success">${stats.tocadas} <span style="font-size:0.9rem;color:var(--muted);font-weight:500;">/ ${stats.pendentes}</span></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Taxa de Atendimento</div>
            <div class="kpi-value">${stats.taxaAtendimento}%</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Pedidos com Pix</div>
            <div class="kpi-value accent">${stats.comPix} <span style="font-size:0.85rem;color:var(--muted);font-weight:500;">(${stats.pctPix}%)</span></div>
          </div>
        </div>
        ${renderizarRanking("🏆 Músicas Mais Pedidas", stats.topMusicas)}
        ${renderizarRanking("🎸 Estilos / Ritmos em Alta", stats.topEstilos)}
        ${renderizarRanking("⏰ Horários de Pico", stats.topHorarios)}
      `;
      modal.classList.add("open");
    }

    btnAbrir.addEventListener("click", abrirEstatisticas);
    btnFechar.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.remove("open");
    });
  </script>
</body>
</html>
