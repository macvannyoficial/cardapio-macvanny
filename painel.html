<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Cantor — Cardápio Musical</title>
  <link rel="manifest" href="https://macvannyoficial.github.io/cardapio-macvanny/manifest-painel.json?v=5">
  <link rel="apple-touch-icon" href="https://macvannyoficial.github.io/cardapio-macvanny/logo%2520mac.jpg?v=5">
  <meta name="theme-color" content="#121212">
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b36;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.75rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #1c2029;
    }

    .menu-btn.primary {
      border-color: rgba(245, 158, 11, 0.45);
    }

    .menu-icon {
      font-size: 1.5rem;
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .menu-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Painel do Cantor</h1>
      <p>Cardápio Musical — Escolha o que deseja gerenciar</p>
    </header>

    <section class="menu-grid" aria-label="Opções do painel">
      <a class="menu-btn primary" href="./pedidos.html">
        <span class="menu-icon">🎶</span>
        <span class="menu-title">VER PEDIDOS</span>
        <span class="menu-desc">Acompanhar pedidos em tempo real e atualizar status</span>
      </a>

      <a class="menu-btn" href="./repertorio.html">
        <span class="menu-icon">🎼</span>
        <span class="menu-title">REPERTÓRIO</span>
        <span class="menu-desc">Incluir músicas, editar nome, artista, estilo e visibilidade</span>
      </a>
    </section>
  </main>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw-painel.js").catch(() => {});
    });
  }
</script>
</body>
</html>
